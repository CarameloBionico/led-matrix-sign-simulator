<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letreiro LED</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-block">
          <span class="status-dot" aria-hidden="true"></span>
          <div>
            <h1>Letreiro LED</h1>
            <p>Simulador de matriz luminosa</p>
          </div>
        </div>
      </header>

      <section class="controls" aria-label="Configuracoes do letreiro">
        <div class="control-panel message-panel">
          <h2>Mensagem</h2>
          <div class="panel-fields">
            <label class="field field-wide">
              <span>Frase</span>
              <input id="messageInput" type="text" value="BEM-VINDO AO LETREIRO LED" maxlength="72" />
            </label>

            <div class="mode-row" role="radiogroup" aria-label="Modo da frase">
              <label>
                <input type="radio" name="mode" value="static" />
                <span>Estática</span>
              </label>
              <label>
                <input type="radio" name="mode" value="scroll" checked />
                <span>Correndo</span>
              </label>
            </div>

            <label class="field">
              <span>Velocidade</span>
              <input id="speedInput" type="range" min="1" max="12" value="5" />
            </label>
          </div>
        </div>

        <div class="control-panel sign-panel">
          <h2>Letreiro</h2>
          <div class="panel-fields">
            <label class="field sign-size-field">
              <span>Largura</span>
              <input id="widthInput" type="number" min="16" max="512" value="88" />
            </label>

            <label class="field sign-size-field">
              <span>Altura</span>
              <input id="heightInput" type="number" min="7" max="48" value="19" />
            </label>

            <input id="gapInput" type="range" min="1" max="8" value="3" hidden />

            <label class="field sign-visual-field">
              <span>Luminosidade</span>
              <input id="ledSizeInput" type="range" min="4" max="14" value="8" />
            </label>

            <label class="field sign-visual-field">
              <span>LED cor</span>
              <input id="colorInput" type="color" value="#ff3b2f" />
            </label>
          </div>
        </div>

        <div class="control-panel font-panel">
          <h2>Fonte</h2>
          <div class="panel-fields">
            <div class="font-composite">
              <div class="font-unity-label" aria-hidden="true">Fonte unica</div>
              <label class="field font-field">
                <span>Familia de fonte <strong id="fontStatusLabel">Simulada, editar</strong></span>
                <select id="fontInput">
                  <option value="classic-matrix-5x7" selected>Classic Matrix 5x7</option>
                </select>
              </label>
              <span class="font-composite-separator" aria-hidden="true">-</span>
              <div class="font-height-readout">
                <span>Altura</span>
                <strong id="fontHeightInput">16</strong>
              </div>
            </div>

            <label class="field">
              <span>Altura da letra <strong id="letterHeightValue">16px</strong></span>
              <input id="letterHeightInput" type="range" min="45" max="100" value="84" />
            </label>

            <input id="letterSpacingInput" type="range" min="0" max="8" value="2" disabled hidden />
          </div>

          <div class="panel-actions font-actions">
            <button id="editorOpenButton" class="tool-button" type="button">Editar fonte</button>
            <button id="fontSaveAsMainButton" class="tool-button secondary" type="button">Salvar como</button>
            <button id="fontDeriveButton" class="tool-button secondary" type="button">Derivar projetada</button>
            <button id="fontDeleteButton" class="tool-button secondary danger" type="button">Apagar familia</button>
          </div>
        </div>

        <div class="control-panel file-panel">
          <h2>Arquivo</h2>
          <div class="panel-actions file-actions">
            <button id="fontExportButton" class="tool-button secondary" type="button">Exportar familia</button>
            <button id="fontFirmwareExportButton" class="tool-button secondary" type="button">Exportar C/C++</button>
            <button id="fontImportButton" class="tool-button secondary" type="button">Importar familia</button>
            <input id="fontImportInput" type="file" accept="application/json,.json" hidden />
          </div>
        </div>
      </section>

      <section class="stage" aria-label="Pre-visualizacao do letreiro">
        <div class="sign-frame">
          <canvas id="ledCanvas" aria-label="Simulacao do letreiro LED"></canvas>
          <div class="glass-shine" aria-hidden="true"></div>
        </div>
      </section>

      <section id="glyphEditor" class="glyph-editor" aria-label="Editor de fonte" hidden>
        <div class="glyph-editor-panel">
          <header class="glyph-editor-header">
            <h2>Editor de fonte</h2>
            <div class="editor-font-identity" aria-label="Fonte atual">
              <strong id="fontFamilyNameLabel"></strong>
              <span id="fontEditorHeightLabel"></span>
            </div>
            <div class="editor-header-actions">
              <button id="fontSaveAsButton" class="tool-button secondary" type="button">Salvar como</button>
              <button id="editorCloseButton" class="tool-button secondary" type="button">Voltar</button>
            </div>
          </header>

          <section class="editor-section character-browser" aria-label="Caracteres da fonte">
            <header class="editor-section-header">
              <h3>Caracteres</h3>
            </header>
            <div id="fontPreview" class="font-preview" aria-label="Pre-visualizacao da fonte"></div>
          </section>

          <div class="editor-main-workspace">
            <section class="font-global-metrics" aria-label="Parametros gerais da fonte">
              <h3>Parametros gerais da fonte</h3>
              <div class="font-metric-row font-metric-row-single">
                <label class="toggle-field">
                  <input id="fontMonospaceInput" type="checkbox" checked />
                  <span class="toggle-switch" aria-hidden="true"></span>
                  <span>Monoespacada</span>
                </label>
              </div>
              <div class="font-metric-row">
                <label class="field">
                  <span>Largura padrao</span>
                  <input id="fontDefaultAdvanceInput" type="number" min="1" max="96" />
                </label>
                <label class="field">
                  <span>Espacamento</span>
                  <input id="fontDefaultLetterSpacingInput" type="number" min="0" max="32" />
                </label>
              </div>
              <div class="font-metric-row">
                <label class="field">
                  <span>Baseline</span>
                  <input id="fontBaselineInput" type="number" min="1" max="96" />
                </label>
                <label class="field">
                  <span>Cap height</span>
                  <input id="fontCapHeightInput" type="number" min="0" max="96" />
                </label>
              </div>
              <div class="font-metric-row font-metric-row-extra">
                <label class="field">
                  <span>Ascent</span>
                  <input id="fontAscentInput" type="number" min="0" max="96" />
                </label>
                <label class="field">
                  <span>Descent</span>
                  <input id="fontDescentInput" type="number" min="0" max="96" />
                </label>
                <label class="field">
                  <span>X-height</span>
                  <input id="fontXHeightInput" type="number" min="0" max="96" />
                </label>
              </div>
            </section>

            <section class="editor-section glyph-workbench" aria-label="Caractere selecionado">
            <aside class="glyph-side-panel">
              <div class="glyph-side-header">
                <div class="glyph-character-readout">
                  <h3>Caractere<br/>selecionado</h3>
                  <div>
                    <strong id="editorCharacterLabel">A</strong>
                    <span id="editorCharacterMeta">0x0</span>
                  </div>
                  <small id="editorFontModeReadout">Monoespaçada</small>
                </div>
              </div>

              <div class="glyph-metrics" aria-label="Metricas do glifo">
                <label class="field">
                  <span>Largura</span>
                  <input id="glyphWidthInput" type="number" min="1" max="64" />
                </label>
                <label id="glyphAdvanceField" class="field">
                  <span id="glyphAdvanceLabel">Advance</span>
                  <input id="glyphAdvanceInput" type="number" min="0" max="96" />
                </label>
                <label class="field">
                  <span>Offset X</span>
                  <input id="glyphOffsetXInput" type="number" min="-32" max="32" />
                </label>
                <label class="field">
                  <span>Offset Y</span>
                  <input id="glyphOffsetYInput" type="number" min="-32" max="32" />
                </label>
              </div>
            </aside>

            <div class="glyph-grid-stage">
              <div id="editorGrid" class="glyph-grid" aria-label="Matriz do caractere"></div>
            </div>

            <div class="glyph-toolbox" aria-label="Ferramentas do caractere">
              <button id="editorSaveButton" class="icon-button save" type="button" aria-label="Salvar caractere" title="Salvar caractere">
                <img src="imgs/save.png" alt="" aria-hidden="true" />
              </button>
              <label class="guide-check icon-toggle" title="Linhas de guia">
                <input id="guideToggleButton" type="checkbox" checked />
                <img src="imgs/guidelines.png" alt="" aria-hidden="true" />
                <span>Linhas de guia</span>
              </label>
              <div class="toolbox-row">
                <button id="editorUndoButton" class="icon-button" type="button" aria-label="Desfazer" title="Desfazer">
                  <img src="imgs/undo.png" alt="" aria-hidden="true" />
                </button>
                <button id="editorRedoButton" class="icon-button" type="button" aria-label="Refazer" title="Refazer">
                  <img src="imgs/redo.png" alt="" aria-hidden="true" />
                </button>
              </div>
              <div class="toolbox-row">
                <button id="editorCopyCharacterButton" class="icon-button glyph-action" type="button" aria-label="Copiar caractere" title="Copiar caractere">
                  <img src="imgs/copy.png" alt="" aria-hidden="true" />
                </button>
                <button id="editorPasteCharacterButton" class="icon-button glyph-action" type="button" aria-label="Colar caractere" title="Colar caractere" disabled>
                  <img src="imgs/paste.png" alt="" aria-hidden="true" />
                </button>
              </div>
              <div class="toolbox-row">
                <button id="editorResetButton" class="icon-button danger glyph-action" type="button" aria-label="Resetar caractere" title="Resetar caractere">
                  <img src="imgs/reset.png" alt="" aria-hidden="true" />
                </button>
                <button id="editorDeleteCharacterButton" class="icon-button danger glyph-action" type="button" aria-label="Apagar caractere" title="Apagar caractere">
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M4 7h16" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                    <path d="M6 7l1 14h10l1-14" />
                    <path d="M9 7V4h6v3" />
                  </svg>
                </button>
              </div>
            </div>
          </section>
        </div>
        </div>
      </section>
    </main>

    <dialog id="characterAddDialog" class="app-dialog" aria-labelledby="characterAddTitle">
      <div class="dialog-panel">
        <header>
          <h3 id="characterAddTitle">Adicionar caracteres</h3>
          <button id="characterAddCancelButton" class="icon-button" type="button" aria-label="Fechar" title="Fechar">×</button>
        </header>
        <label class="field">
          <span>Novos caracteres</span>
          <input id="editorNewCharacterInput" type="text" aria-label="Novos caracteres" placeholder="Ex: abc123" />
        </label>
        <div class="dialog-actions">
          <button id="editorAddCharacterButton" class="tool-button primary" type="button">Adicionar</button>
        </div>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
